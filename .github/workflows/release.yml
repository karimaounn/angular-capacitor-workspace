name: Release

on:
  push:
    tags: ['v*']
  # Re-runs a publish that failed halfway, from the tag's ref dropdown. Moving
  # the tag is not the recovery path: every step below is idempotent, and a
  # version already on the registry cannot be replaced anyway.
  workflow_dispatch:

# A cancelled release is the half-published state — the generator out, the
# `/create` shell pointing at it still unpublished. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Every package names this repository, `release.yml` and the `npm` environment
# as a trusted publisher on npmjs.com — `@angular-capacitor-workspace/cli`,
# `/create`, and the runtime packages `/i18n` and `/theming`. That
# configuration and this file are one mechanism in two places: a rename on
# either side, or a new package nobody configured, is a failed publish.

jobs:
  guard:
    name: Check the tag against the tree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The tag name reaches the shell through the environment rather than
      # through an expression pasted into the script, which would run whatever
      # a tag was named.
      - name: Check
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$TAG" --notes "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  verify:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [guard, verify]
    runs-on: ubuntu-latest
    # Room for each of the four packages to wait out the registry's slowest day
    # (ten minutes each, below), plus the build.
    timeout-minutes: 50
    # Holds the run for a manual approval once a required reviewer is added to
    # the `npm` environment in the repository settings. With no rules on it,
    # the job runs straight through.
    #
    # The name is also part of what the registry checks: it appears in the OIDC
    # claim, so renaming it here without renaming it on every package's trusted
    # publisher breaks the publish rather than the approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@angular-capacitor-workspace/cli
    permissions:
      contents: read
      # This is the credential. npm trusts a publish from this repository, this
      # workflow file and this environment, so there is no token to leak or
      # rotate — and none that January 2027 takes away. It also carries the
      # provenance attestation, which is why `npm publish` needs no
      # `--provenance` below.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --strict-allow-scripts

      # `prepublishOnly` rebuilds each package as it goes out; this is the
      # build that fails loudly, before anything has been published.
      - run: npm run build

      - name: Publish
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DIST_TAG: ${{ needs.guard.outputs.dist-tag }}
        run: |
          set -euo pipefail

          # `npm view` reads through the restored npm cache and can be
          # answered by a stale CDN edge, so ask the registry for the version
          # document directly. 404 until it lands, 200 once it has.
          #
          # The unique query string is what makes that true. The skip check
          # below asks for this exact URL moments before publishing and gets a
          # 404, and that miss is cacheable: without a cache buster the poll
          # afterwards is served the same stored 404 for as long as the edge
          # holds it, and a release that published perfectly well fails on a
          # wait that was never going to see anything change.
          on_registry() {
            curl -fsS -o /dev/null \
              "https://registry.npmjs.org/${1//\//%2F}/$VERSION?t=$(date +%s)-$RANDOM"
          }

          # Each package, and the directory it publishes from. The runtime
          # packages publish their ng-packagr output, `dist/`; the other two
          # publish themselves. Each path starts with `./`: npm reads a bare
          # `packages/<name>` as the GitHub repository `packages/<name>`.
          #
          # Order is load-bearing: the generator writes the runtime packages
          # into every workspace it generates, at `^` its own version, and
          # `/create` depends on the generator at an exact version. Publishing
          # each after what it depends on keeps the window in which `npm create`
          # resolves something that does not exist to seconds, and on the side
          # that fails loudly.
          for entry in \
            @angular-capacitor-workspace/i18n=./packages/i18n/dist \
            @angular-capacitor-workspace/theming=./packages/theming/dist \
            @angular-capacitor-workspace/cli=./packages/cli \
            @angular-capacitor-workspace/create=./packages/create; do
            name="${entry%%=*}"
            directory="${entry#*=}"
            # A re-run after a failure finds the first package already out.
            # Skipping it is what makes the whole job safe to run again.
            if on_registry "$name"; then
              echo "$name@$VERSION is already on the registry — skipping."
              continue
            fi

            echo "Publishing $name@$VERSION under $DIST_TAG"
            npm publish "$directory" --tag "$DIST_TAG"

            # `npm publish` is the authoritative signal: it exits non-zero if
            # the registry refuses. This only catches the rarer case of a
            # success that leaves nothing installable — a green job, a release
            # announcing itself, and a version nobody can add.
            #
            # Be patient about it. The registry's read path is a separate,
            # CDN-fronted system that trails its write path, and a window of
            # seconds here fails releases that published perfectly well, and so,
            # on a slow day, did three minutes. Ten cost nothing on a run that is
            # about to succeed anyway.
            live=""
            for attempt in $(seq 1 60); do
              if on_registry "$name"; then
                live="$VERSION"
                break
              fi
              sleep 10
            done

            if [ -z "$live" ]; then
              echo "$name@$VERSION did not appear on the registry within ten minutes,"
              echo "though publishing it reported success."
              echo
              echo "Check https://www.npmjs.com/package/$name first. If the version is"
              echo "listed, the publish worked and this check simply outran the registry:"
              echo "re-run this workflow from the tag and it will skip ahead to the rest."
              echo "If it is not listed, look for a pending version under Publishing"
              echo "access in the package settings before re-running."
              exit 1
            fi
          done

  github-release:
    name: Publish the GitHub release
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # A prerelease publishes under `next`, and should not be what the
          # repository's front page calls the latest release either.
          PRERELEASE: ${{ needs.guard.outputs.dist-tag != 'latest' && '--prerelease' || '' }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists — leaving it alone."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            $PRERELEASE
